version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    # Paused for September 2026 to stay inside the included Actions minutes.
    # Delete this line to resume version updates.
    open-pull-requests-limit: 0
    commit-message:
      prefix: "fix"
      prefix-development: "chore"
      include: "scope"

  # Also the only thing watching the Rust version: there is no
  # rust-toolchain.toml for that ecosystem to read.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    # Paused for September 2026 to stay inside the included Actions minutes.
    # Delete this line to resume version updates.
    open-pull-requests-limit: 0
    commit-message:
      prefix: "fix"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Paused for September 2026 to stay inside the included Actions minutes.
    # Delete this line to resume version updates.
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore"
      include: "scope"
